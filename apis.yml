aid: brandct
name: BrandCT
description: 'BrandCT (品牌CT) is an offline-retail market-monitoring service operated by Mashangying
  (马上赢市场调查 / yikuaigao), a Chinese retail-data company. It has built a national offline-retail
  monitoring network based on POS data from a panel of sample stores, and delivers brand owners a
  "BrandCT" service that scans more than 10 million products across offline retail formats to quantify
  market share, distribution (铺市率), and product sell-through. The platform supports quantitative
  analysis of product innovation, channel competition, and category trends to speed up and sharpen
  client decision-making. The product is delivered through a login-gated web dashboard (WeChat, phone,
  and email verification sign-in); no public developer API, OpenAPI specification, or /.well-known
  discovery surface was found during enrichment.'
